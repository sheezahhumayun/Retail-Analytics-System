services:
  postgres:
    image: postgres:16
    container_name: retail-analytics-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail_analytics
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d retail_analytics"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
